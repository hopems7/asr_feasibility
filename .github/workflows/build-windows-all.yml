# Builds every feasibility executable in this repository on Windows, tests each
# one, and offers them as downloadable artifacts. Pushing a tag such as v1.5.0
# also publishes all of them together on one GitHub Release page.
#
# To add another program, add an entry under "include" below.
# This replaces build-windows.yml and build-windows-drive.yml; delete those two
# so each change isn't built twice.
name: Build Windows executables

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.py"
      - ".github/workflows/build-windows-all.yml"
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false            # one program failing doesn't stop the others
      matrix:
        include:
          - name: asr_feasibility
            script: asr_feasibility.py
            options: >-
              --exclude-module googleapiclient --exclude-module google_auth_oauthlib
            check: smoke
          - name: drive_feasibility
            script: drive_feasibility.py
            options: --collect-data googleapiclient
            check: selfcheck
    name: Build ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: >
          python -m pip install "numpy>=1.22" "imageio-ffmpeg>=0.4.9" "webrtcvad-wheels>=2.0.11"
          "google-api-python-client>=2.100" "google-auth-oauthlib>=1.0" "pyinstaller>=6.0"

      - name: Build
        run: >
          pyinstaller --noconfirm --clean --onefile --console
          --collect-all imageio_ffmpeg
          --exclude-module faster_whisper --exclude-module ctranslate2 --exclude-module torch
          ${{ matrix.options }}
          --name ${{ matrix.name }} ${{ matrix.script }}

      - name: Smoke test (synthetic audio, no system ffmpeg)
        if: matrix.check == 'smoke'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          python -c "import numpy as np, wave; sr=16000; t=np.arange(sr*20)/sr; x=(0.2*np.sin(2*np.pi*300*t)*((t%1.5)<1.0)*32767).astype(np.int16); w=wave.open('smoke/test.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr); w.writeframes(x.tobytes()); w.close()"
          $env:PATH = "C:\Windows\System32"
          $null | .\dist\${{ matrix.name }}.exe smoke --output smoke_out
          if (-not (Test-Path smoke_out\feasibility_report.txt)) { Write-Error "No report produced"; exit 1 }

      - name: Installation check (offline, no sign-in, no system ffmpeg)
        if: matrix.check == 'selfcheck'
        shell: pwsh
        run: |
          $env:PATH = "C:\Windows\System32"
          .\dist\${{ matrix.name }}.exe --check
          if ($LASTEXITCODE -ne 0) { Write-Error "Installation check failed"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-windows
          path: dist/${{ matrix.name }}.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish all executables on one release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$TAG" dist/*.exe --repo "$GITHUB_REPOSITORY"
          --title "$TAG" --notes "Windows builds of the feasibility tools."
